<!doctype html>
<!-- Entry page for BhopCraft. Vite injects the bundled src/main.ts; the canvas and HUD are created by the game phases. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BhopCraft</title>
    <!-- Empty inline favicon: avoids a 404 request for /favicon.ico (no icon asset is shipped). -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Root container: the WebGL canvas and the DOM HUD overlay are appended here. -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
