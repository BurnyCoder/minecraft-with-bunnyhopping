# Continuous integration: type-check + production build, unit tests and the e2e check on every push to main and every
# pull request. Deployment to GitHub Pages is separate (pages.yml, main only).
# Actions: https://github.com/actions/checkout and https://github.com/actions/setup-node (npm cache via package-lock.json).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # Fetch the repository.
      - uses: actions/setup-node@v7 # Install Node.js with npm caching.
        with:
          node-version: 24
          cache: npm
      - run: npm ci # Exact dependency versions from package-lock.json.
      - run: npm run build # tsc --noEmit + vite build: the same production bundle the Pages workflow deploys.
      - run: npm test # Vitest unit + integration tests.
  e2e:
    # Full game in headless Chrome (preinstalled on ubuntu runners at /usr/bin/google-chrome) with autoplay;
    # fails if the game log shows errors, friction ticks during bhop, or speed off the closed form.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e -- --seconds 6
      - uses: actions/upload-artifact@v7 # Keep logs and screenshots for inspection.
        if: always()
        with:
          name: e2e-logs
          path: logs/
